name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:


jobs:
  unit:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: 3.2
            openvox: 8
            fixtures: .fixtures.yml
            allow_failure: false
          - ruby: 4.0
            openvox: 9
            fixtures: .fixtures.yml
            allow_failure: false
    env:
      BUNDLE_WITHOUT: system_tests:release
      OPENVOX_GEM_VERSION: "~> ${{ matrix.openvox }}.0"
      FIXTURES_YML: ${{ matrix.fixtures }}
    name: OpenVox ${{ matrix.openvox }} (Ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@v3
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 3
      - name: Validate
        run: bundle exec rake check:git_ignore check:dot_underscore check:test_file rubocop syntax lint metadata_lint
      - name: Run tests
        run: bundle exec rake parallel_spec
  acceptance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        set:
          - "el8"
          - "el9"
          - "el10"
          - "debian-12"
          - "debian-13"
          - "ubuntu-2204"
          - "ubuntu-2404"
          - "ubuntu-2604"
        openvox:
          - "openvox8"
        keycloak_version:
          - "26.7.5"
          - "26.8.2"
        keycloak_full:
          - "no"
        include:
          - set: "el9"
            openvox: "openvox8"
            keycloak_version: "26.7.5"
            keycloak_full: "batch1"
          - set: "el9"
            openvox: "openvox8"
            keycloak_version: "26.7.5"
            keycloak_full: "batch2"
          - set: "el9"
            openvox: "openvox8"
            keycloak_version: "26.8.2"
            keycloak_full: "batch1"
          - set: "el9"
            openvox: "openvox8"
            keycloak_version: "26.8.2"
            keycloak_full: "batch2"
    env:
      BUNDLE_WITHOUT: release
      BEAKER_debug: true
    name: ${{ matrix.puppet }} ${{ matrix.set }} (keycloak=${{ matrix.keycloak_version }} full=${{ matrix.keycloak_full }})
    steps:
      - uses: actions/checkout@v3
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 3
      - name: Run tests
        run: bundle exec rake beaker
        env:
          BEAKER_PUPPET_COLLECTION: ${{ matrix.openvox }}
          BEAKER_set: ${{ matrix.set }}
          BEAKER_keycloak_version: ${{ matrix.keycloak_version }}
          BEAKER_keycloak_full: ${{ matrix.keycloak_full }}
